services:
  autopatch-api:
    build: .
    image: autopatch-forge-api:latest
    container_name: autopatch-forge-api
    ports:
      - "8000:8000"
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    environment:
      - APP_ENV=development
    env_file:
      - .env.local
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
    expose:
      - "8000"
    restart: unless-stopped

  autopatch-console:
    build: .
    image: autopatch-forge-console:latest
    container_name: autopatch-forge-console
    ports:
      - "8501:8501" 
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.baseUrlPath=autopatch"
      ]
    environment:
      - APP_ENV=development
    env_file:
      - .env.local
    expose:
      - "8501"
    depends_on:
      - autopatch-api
    restart: unless-stopped
    
  autopatch-nginx:
    image: nginx:alpine
    container_name: autopatch-forge-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - autopatch-api
      - autopatch-console
    restart: unless-stopped
