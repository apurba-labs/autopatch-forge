server {
    listen 80;
    server_name autopatch.gotihub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name autopatch.gotihub.com;

    ssl_certificate /etc/letsencrypt/live/autopatch.gotihub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopatch.gotihub.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 20M;

    # Streamlit Frontend Console
    location / {
        proxy_pass http://autopatch-console:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # FastAPI Backend App under /api/
    location /api/ {
        proxy_pass http://autopatch-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://autopatch-api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://autopatch-api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
