server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Streamlit Frontend Console
    location /autopatch/ {
        proxy_pass http://autopatch-console:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Backend App
    location /autopatch/api/v1/ {
        proxy_pass http://autopatch-api:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /autopatch/docs {
        proxy_pass http://autopatch-api:8000/autopatch/api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /autopatch/openapi.json {
        proxy_pass http://autopatch-api:8000/autopatch/api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
