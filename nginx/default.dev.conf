server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # 1. Streamlit Frontend Console
    location /autopatch/ {
        proxy_pass http://autopatch-forge-console:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. FastAPI Backend App
    location /autopatch/api/v1/ {
        # FIX: Point to the exact container name running in docker ps
        proxy_pass http://autopatch-forge-api:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Documentation Framework
    location /autopatch/docs {
        proxy_pass http://autopatch-forge-api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /autopatch/openapi.json {
        proxy_pass http://autopatch-forge-api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
